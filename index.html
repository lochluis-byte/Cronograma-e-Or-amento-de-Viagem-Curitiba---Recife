<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronograma de Viagem - Curitiba a Recife</title>
    
    <!-- Link para o CSS principal -->
    <link rel="stylesheet" href="style.css">
    
    <!-- CDN da biblioteca Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <main class="container">
        <header class="header">
            <h1>Cronograma de Viagem</h1>
            <p>Curitiba ✈️ Recife — Detalhamento do Orçamento Total</p>
        </header>

        <!-- Tabela com os Dados da Viagem -->
        <section class="table-section">
            <table>
                <thead>
                    <tr>
                        <th>Categoria</th>
                        <th>Preço</th>
                        <th>Qtd.</th>
                        <th>Valor Final</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Passagem de avião</td>
                        <td>R$ 1.300,00</td>
                        <td>1</td>
                        <td>R$ 1.300,00</td>
                    </tr>
                    <tr>
                        <td>Hospedagem</td>
                        <td>R$ 200,00</td>
                        <td>5</td>
                        <td>R$ 1.000,00</td>
                    </tr>
                    <tr>
                        <td>Alimentação</td>
                        <td>R$ 100,00</td>
                        <td>5</td>
                        <td>R$ 500,00</td>
                    </tr>
                    <tr>
                        <td>Transporte</td>
                        <td>R$ 50,00</td>
                        <td>3</td>
                        <td>R$ 150,00</td>
                    </tr>
                    <tr class="total-row">
                        <td colspan="3">Total</td>
                        <td>R$ 2.950,00</td>
                    </tr>
                </tbody>
            </table>
        </section>
